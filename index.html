<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مُحوِّل المقالات إلى سيناريوهات شورتس</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #38bdf8; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    textarea { width: 100%; min-height: 150px; padding: 1rem; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 1rem; resize: vertical; }
    select { padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 1rem; margin-bottom: 1rem; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 0.8rem 2rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #7dd3fc; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #error { color: #f87171; margin-top: 1rem; font-weight: 600; }
    #results { margin-top: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .scene-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; }
    .scene-card h3 { color: #38bdf8; margin-bottom: 0.8rem; font-size: 1.2rem; }
    .scene-card p { margin-bottom: 0.6rem; line-height: 1.6; color: #cbd5e1; }
    .scene-card strong { color: #94a3b8; }
    .loader { display: none; margin-top: 1rem; color: #38bdf8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 حوِّل مقالتك إلى سيناريو شورتس</h1>

    <label for="article">الصق المقال هنا:</label>
    <textarea id="article" placeholder="اكتب أو الصق المقال الذي تريد تحويله..."></textarea>

    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 1rem;">
      <label for="style" style="margin: 0;">اختر الأسلوب:</label>
      <select id="style">
        <option value="كوميدي">كوميدي</option>
        <option value="قصصي">قصصي</option>
        <option value="تشويقي">تشويقي</option>
      </select>
      <button id="generateBtn">معالجة وتحويل</button>
    </div>

    <div id="loader" class="loader">⏳ جاري المعالجة بالذكاء الاصطناعي...</div>
    <div id="error"></div>
    <div id="results"></div>
  </div>

  <script>
    const btn = document.getElementById('generateBtn');
    const loader = document.getElementById('loader');
    const errorDiv = document.getElementById('error');
    const resultsDiv = document.getElementById('results');

    btn.addEventListener('click', async () => {
      const article = document.getElementById('article').value.trim();
      const style = document.getElementById('style').value;

      errorDiv.textContent = '';
      resultsDiv.innerHTML = '';

      if (!article) {
        errorDiv.textContent = 'الرجاء إدخال المقال أولاً.';
        return;
      }

      btn.disabled = true;
      loader.style.display = 'block';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ article, style }),
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `فشل الطلب (رمز ${response.status})`);
        }

        const data = await response.json();

        if (!data.scenes || !Array.isArray(data.scenes) || data.scenes.length === 0) {
          throw new Error('لم يتم استلام سيناريوهات صالحة من الخادم.');
        }

        data.scenes.forEach((scene) => {
          const card = document.createElement('div');
          card.className = 'scene-card';
          card.innerHTML = `
            <h3>الجزء ${scene.part}: ${escapeHtml(scene.title)}</h3>
            <p><strong>🎥 المشهد البصري:</strong> ${escapeHtml(scene.visualScene)}</p>
            <p><strong>📝 النص:</strong> ${escapeHtml(scene.script)}</p>
          `;
          resultsDiv.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        errorDiv.textContent = err.message || 'حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.';
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
